# Local dev services only.
# Synthetic data only — never load real learner data here.
name: tomcom-dev
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: tomcom
      POSTGRES_PASSWORD: tomcom
      POSTGRES_DB: tomcom_dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tomcom -d tomcom_dev']
      interval: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30
  # S3-compatible object storage for media and lesson packs (dev only; production uses the cloud store).
  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: tomcom-dev
      RUSTFS_SECRET_KEY: tomcom-dev-secret
    ports: ['9000:9000']
    volumes: [s3data:/data]
volumes:
  pgdata:
  s3data:
